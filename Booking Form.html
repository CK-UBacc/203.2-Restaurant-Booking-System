<!doctype html> 
<html>

<head>

</head>

<body>
<form id="Booking Form" method="POST" action="{{ url_for('BookingForm') }}">
    
  <label for="name">First Name</label>
    <input type="text" name="name" placeholder="John Doe" pattern=[A-Z\sa-z]{3,20} required>
    <br>
 
  
    <label for="email">Email Address</label>
    <input type="email" name="email" placeholder="john.doe@email.com" required>
    <br>
  
    <label for="phone">Phone Number</label>
    <input type="tel" name="phone" placeholder="498-348-3872" pattern=(\d{3})-?\s?(\d{3})-?\s?(\d{4}) required>
    
    <br>
    <label for="guestCount">Group Size</label>
    <select name="guestCount" required>
        <option value="">Please Select the size of your group</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      
    </select>

  <hr>
 
  
 
    <label for="time">Reservation Time</label>
    <select name="time" required>
        <option value="">Please Select a reservation time</option>
        <option value="6:00PM">6:00PM</option>
        <option value="6:30PM">6:30PM</option>
        <option value="7:00PM">7:00PM</option>
        <option value="7:30PM">7:30PM</option>
        <option value="8:00PM">8:00PM</option>
        <option value="8:30PM">8:30PM</option>
        <option value="9:00PM">9:00PM</option>
        <option value="9:30PM">9:30PM</option>
        <option value="10:00PM">10:00PM</option>
        <option value="10:30PM">10:30PM</option>
        <option value="11:00PM">11:00PM</option>
    </select>

  <hr>
 
  <button type="submit">Confirm Reservation</button>

 
</form>

</body> 
</html>
